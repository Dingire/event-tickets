[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm start"
# /health answers from memory only. Using "/" here meant a contended database write
# could report the server unhealthy and get it restarted mid-request.
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Space the retries out so a failing boot cannot burn all ten attempts in seconds.
restartPolicyDelay = 10